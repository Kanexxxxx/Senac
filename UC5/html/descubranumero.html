<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Descubra o Numero</title>
</head>

<body>
    <img src="../IMG/descubranumero.jpg" alt="Descubra o Numero" class="normal">
    <h1>Jogo Descubra o Numero</h1>

    <form>
        <p>Numero:
            <input type="number" id="inNumero" min="1" max="100" required autofocus>
            <input type="submit" id="btSubmit" value="Apostar">
            <input type="button" id="btNovo" value="Jogar novamente" class="oculta">
        </p>
    </form>

    <h3>Erros: <span id="outErros">0</span></h3>
    <h3>Chances: <span id="outChances">6</span></h3>
    <h3 id="outDica" class="italico">Dica: e um numero entre 1 e 100</h3>

    <script src="../JS/descubranumero.js"></script>
</body>

</html>
