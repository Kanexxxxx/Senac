<!DOCTYPE html>
<html lang="pt-br">
<head>
<link rel="stylesheet" href="../../CSS/style.css">
<meta charset="UTF-8">
<title>Exercício 2</title>

</head>
<body>
<h2>Cadastro de Alunos</h2>

Nome:
<input id="nome">

<button onclick="cadastrar()">Cadastrar</button>
<button onclick="listar()">Listar</button>
<button onclick="pesquisar()">Pesquisar</button>
<button onclick="remover()">Remover</button>

<div id="saida"></div>

<script>

const alunos=[];

function cadastrar(){
    const nome=document.getElementById("nome").value.trim();

    if(nome=="") return;
    alunos.push(nome);
    document.getElementById("nome").value="";
}

function listar(){
    let texto="<h3>Alunos</h3>";

    for(const aluno of alunos){
        texto+=aluno+"<br>";
    }

    texto+="<br>";
    texto+="Primeiros três:<br>";
    texto+=alunos.slice(0,3).join("<br>");
    document.getElementById("saida").innerHTML=texto;
}

function pesquisar(){
    const nome=document.getElementById("nome").value;

    if(alunos.includes(nome)){
        alert("Encontrado na posição "+alunos.indexOf(nome));
    }else{
        alert("Aluno não encontrado");
    }
}

function remover(){
    const nome=document.getElementById("nome").value;
    const pos=alunos.indexOf(nome);

    if(pos==-1){
        alert("Aluno não encontrado");
    }else{
        alunos.splice(pos,1);
        listar();
    }
}

</script>

</body>
</html>
