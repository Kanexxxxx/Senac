<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Revenda de Veiculos</title>
</head>

<body>
    <img src="../IMG/exerc.jpg" alt="Veiculo">
    <h1>Revenda de Veiculos</h1>

    <form>
        <p>Modelo:
            <input type="text" id="inModelo" required>
        </p>
        <p>Preco R$:
            <input type="number" id="inPreco" min="0" step="0.01" required>
            <input type="submit"  value="Adicionar">
        </p>
        <p>
            <input type="button" value="Listar todos" id="btnListar">
            <input type="button" value="Filtrar por Preço" id="btFiltrar">
            <input type ="button" value="Simular Promoção" id="btnSimular">
         </p>
    </form>

    <pre id="pre"></pre>

    <script src="../JS/revenda2.js"></script>
</body>

</html>
