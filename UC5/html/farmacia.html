<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Farmacia</title>
</head>

<body>
    <img src="../IMG/exerc.jpg" alt="Farmacia">
    <h1>Programa Farmacia</h1>

    <form>
        <p>Medicamento:
            <input type="text" id="inMedicamento" required>
        </p>
        <p>Preco R$:
            <input type="number" id="inPreco" min="0" step="0.01" required>
        </p>
        <p>
            <input type="submit" value="Mostrar Promocao">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3 id="outMedicamento"></h3>
    <h3 id="outPromocao"></h3>

    <script src="../JS/farmacia.js"></script>
</body>

</html>
