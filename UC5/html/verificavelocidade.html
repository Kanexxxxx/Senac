<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Verifica Velocidade</title>
</head>

<body>
    <img src="../IMG/exerc.jpg" alt="Exercicios">
    <h1>Programa Verifica Velocidade</h1>

    <form>
        <p>Velocidade permitida:
            <input type="number" id="inVelPermitida" min="1" step="0.1" required>
        </p>
        <p>Velocidade do condutor:
            <input type="number" id="inVelCondutor" min="0" step="0.1" required>
        </p>
        <p>
            <input type="submit" value="Verificar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3></h3>

    <script src="../JS/verificaVelocidade.js"></script>
</body>

</html>
