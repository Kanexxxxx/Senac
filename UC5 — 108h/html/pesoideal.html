<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Peso Ideal</title>
</head>

<body>
    <img src="../IMG/pesoideal.jpg" alt="Balanca">
    <h1>Calculadora de Peso Ideal</h1>

    <form>
        <p>Nome:
            <input type="text" id="inNome" required>
        </p>
        <p>Sexo:
            <label>
                <input type="radio" name="sexo" id="inMasculino" required>
                Masculino
            </label>
            <label>
                <input type="radio" name="sexo" id="inFeminino">
                Feminino
            </label>
        </p>
        <p>Altura:
            <input type="number" id="inAltura" min="0" step="0.01" required>
        </p>
        <p>
            <input type="submit" value="Calcular Peso Ideal">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3></h3>

    <script src="../JS/pesoIdeal.js"></script>
</body>

</html>
