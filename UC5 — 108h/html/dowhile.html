<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While</title>
</head>

<body>
    <script>
        let num;

        // O do while executa pelo menos uma vez.
        do {
            num = Number(prompt("Digite um numero:"));

            if (isNaN(num)) {
                alert("Informe apenas numeros.");
            }
        } while (isNaN(num));

        alert("Numero informado: " + num);
    </script>
</body>

</html>
