<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Fuso Horario</title>
</head>

<body>
    <img src="../IMG/fusohorario.jpg" alt="Globo terrestre">
    <h1>Programa Fuso Horario</h1>

    <form>
        <p>Hora no Brasil (h.mm):
            <input type="number" id="inHoraBrasil" min="0" max="23.59" step="0.01" required>
        </p>
        <p>
            <input type="submit" value="Exibir Hora na Franca">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3></h3>

    <script src="../JS/fusohorario.js"></script>
</body>

</html>
