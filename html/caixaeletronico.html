<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Caixa Eletronico</title>
</head>

<body>
    <img src="../IMG/caixaeletronico.jpg" alt="Caixa eletronico">
    <h1>Programa Caixa Eletronico</h1>

    <form>
        <p>Valor do saque R$:
            <input type="number" id="inSaque" min="10" step="10" required>
        </p>
        <p>
            <input type="submit" value="Exibir Notas">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3 id="outNotas100"></h3>
    <h3 id="outNotas50"></h3>
    <h3 id="outNotas10"></h3>

    <script src="../JS/caixaEletronico.js"></script>
</body>

</html>
