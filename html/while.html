<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
</head>

<body>
    <script>
        let i = 10;
        let resposta = "";

        // Enquanto i for maior que zero, o laco continua.
        while (i > 0) {
            resposta = resposta + i + " ";
            i = i - 1;
        }

        alert(resposta);
    </script>
</body>

</html>
