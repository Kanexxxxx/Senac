<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Media do Aluno</title>
</head>

<body>
    <img src="../IMG/js.png" alt="JavaScript">
    <h1>Programa Media do Aluno</h1>

    <form>
        <p>Nome:
            <input type="text" id="inNome" required>
        </p>
        <p>1a Nota:
            <input type="number" id="inNota1" min="0" max="10" step="0.1" required>
        </p>
        <p>2a Nota:
            <input type="number" id="inNota2" min="0" max="10" step="0.1" required>
        </p>
        <p>
            <input type="submit" value="Calcular Media">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3></h3>

    <script src="../JS/media.js"></script>
</body>

</html>
