<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Triangulo</title>
</head>

<body>
    <img src="../IMG/exerc.jpg" alt="Exercicios">
    <h1>Programa Lados de um Triangulo</h1>

    <form>
        <p>Lado A:
            <input type="number" id="inLadoA" min="1" step="0.1" required>
        </p>
        <p>Lado B:
            <input type="number" id="inLadoB" min="1" step="0.1" required>
        </p>
        <p>Lado C:
            <input type="number" id="inLadoC" min="1" step="0.1" required>
        </p>
        <p>
            <input type="submit" value="Verificar Lados">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3 id="outSimNao"></h3>
    <h3 id="outTipo"></h3>

    <script src="../JS/triangulo.js"></script>
</body>

</html>
