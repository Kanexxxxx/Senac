<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Restaurante</title>
</head>

<body>
    <img src="../IMG/exerc.jpg" alt="Restaurante">
    <h1>Programa Restaurante</h1>

    <form>
        <p>Preco por kg R$:
            <input type="number" id="inPrecoKg" min="0" step="0.01" required>
        </p>
        <p>Consumo em gramas:
            <input type="number" id="inConsumo" min="0" step="1" required>
        </p>
        <p>
            <input type="submit" value="Calcular Valor">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3></h3>

    <script src="../JS/restaurante.js"></script>
</body>

</html>
