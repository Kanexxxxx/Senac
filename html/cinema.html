<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../IMG/js.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Cinema</title>
</head>

<body>
    <img src="../IMG/exerc.jpg" alt="Cinema">
    <h1>Programa Cinema</h1>

    <form>
        <p>Titulo do filme:
            <input type="text" id="inTitulo" required>
        </p>
        <p>Duracao em minutos:
            <input type="number" id="inDuracao" min="1" step="1" required>
        </p>
        <p>
            <input type="submit" value="Converter Duracao">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <h3 id="outTitulo"></h3>
    <h3 id="outDuracao"></h3>

    <script src="../JS/cinema.js"></script>
</body>

</html>
